name = "cloud-mail"
main = "index.js"
compatibility_date = "2025-06-04"

[assets]
directory = "./public"
binding = "assets"
not_found_handling = "single-page-application"
run_worker_first = true

[assets.headers]
"/assets/*" = { Cache-Control = "public, max-age=31556952, immutable" }
"/image/*" = { Cache-Control = "public, max-age=604800, immutable" }
"/tinymce/*" = { Cache-Control = "public, max-age=604800, immutable" }

[ai]
binding = "ai"

[[d1_databases]]
binding = "db"
database_name = "db"
database_id = "66b09085-cbe8-434c-8cb8-2e9746c8f7df"

[[kv_namespaces]]
binding = "kv"
id = "535124fcf7ae4b319058f348099ed351"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail"

[vars]
admin = "admin@zenext.web.id"
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
domain = ["zenext.web.id"]
jwt_secret = "REPLACE_WITH_YOUR_SECRET"
orm_log = false
